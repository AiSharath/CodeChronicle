services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      RUNNER_MODE: process
      MAX_CODE_SIZE: 50000
      EXEC_TIMEOUT_MS: 5000
      ALLOWED_ORIGINS: http://localhost:8080
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
